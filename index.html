<!DOCTYPE html>
<html lang="es">

<head>
  <!-- metatags-->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Argenmap es un visor de mapas interactivo que permite visualizar y consultar información geográfica de Argentina.">
  <meta name="keywords" content="mapas, geografía, Argentina, visor de mapas, información geográfica">
  <meta name="author" content="Instituto Geográfico Nacional">
  <title>Argenmap</title>
  <link rel="icon" href="src/styles/images/favicon.ico" type="image/x-icon">

  <!-- Bootstrap core CSS -->
  <link rel="stylesheet" href="https://getbootstrap.com/docs/3.3/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">

  <!-- Plugins -->

  <!-- jQuery -->
  <script src="src/js/plugins/jquery/jquery-3.7.0.min.js"></script>
  <script src="src/js/utils/dependencies/dependency-loader.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.6.0/leaflet.css" crossorigin="anonymous" >
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.6.0/leaflet.js" crossorigin="anonymous"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" >
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" >

  <!-- Main Styles -->
  <link rel="stylesheet" href="src/styles/css/main.css" >
  <link href="src/styles/css/dashboard.css" rel="stylesheet" >
  <!--   <link href="src/js/components/zoomLevel/ZoomLevel.css" rel="stylesheet"> -->
  <link href="src/js/components/openfiles/openfiles.css" rel="stylesheet" >
  <link href="src/js/components/loadServices/loadServices.css" rel="stylesheet" >
  <link href="src/js/components/context-menu/context-menu.css" rel="stylesheet" >
  <link href="src/js/components/user-message/user-message.css" rel="stylesheet" >
  <link href="src/js/components/about/about.css" rel="stylesheet" >
  <link href="src/js/components/login/login.css" rel="stylesheet" >

  <!-- Argenmap basic libraries  -->
  <script src="src/js/utils/analytics/analytics.js"></script>
  <script src="src/js/utils/constants/constants.js"></script>
  <script src="src/js/entities.js"></script>
  <script src="src/js/utils/functions/functions.js"></script>
  <script src="src/js/components/url-interaction/URLInteraction.js"></script>
  <!--   <script src="src/js/components/zoomLevel/ZoomLevel.js"></script> -->
  <script src="src/js/components/openfiles/openfiles.js"></script>
  <script src="src/js/components/loadServices/loadServices.js"></script>
  <!--<script src="src/js/components/loadLayersModal/loadLayersModal.js"></script>-->
  <script src="src/js/components/context-menu/context-menu.js"></script>
  <script src="src/js/components/user-message/user-message.js"></script>
  <script src="src/js/app.js"></script>
  <script src="src/js/components/styles/styles.js"></script>
  <script src="src/js/components/login/login.js"></script>
  <script src="src/js/components/toolbar/toolbar.js"></script>
  <script src="src/js/components/UI/UserInterface.js"></script>
  <script src="src/js/components/about/about.js"></script>

  <!-- Leaflet EditableLabel -->
  <link rel="stylesheet" href="src/js/map/plugins/leaflet/leaflet-editable-label/Leaflet.EditableLabel.css" >
  <script src="src/js/map/plugins/leaflet/leaflet-editable-label/Leaflet.EditableLabel.js"></script>

</head>

<body>
  <nav class="navbar navbar-fixed-top">
    <div class="container-fluid">
      <div class="row center-flex">
        <div class="col-xs-4 col-sm-8 col-md-8 start-flex">
          <div id="logo-navbar" class="navbar-content">
            <a id="top-left-logo-link" href="#" title="Logo" target="_blank" aria-label="Logo">
              <img id="top-left-logo" src="src/styles/images/noimage.webp" alt="Logo" title="Logo">
            </a>
            <a id="logoText" aria-label="Texto del logo"></a>
          </div>
        </div>

        <div class="col-xs-8 col-sm-4 col-md-4 pe-0 end-flex">
          <div id="search-navbar" class="navbar-content"></div>
        </div>

        <div id="logo-help" class="navbar-new-content">
          <span class="xxsmall-hide">
            <a id="top-right-logo-link" href="#" title="Logo" target="_blank" aria-label="Logo">
              <img id="top-right-logo" src="src/styles/images/noimage.webp" alt="Logo" title="Logo">
            </a>
          </span>
        </div>

        <span id="geoserver-login-btn" class="navbar-content"></span>
      </div>
    </div>
  </nav>

  <div class="menu-container top-around-flex">
    <div id="botonera">
      <button type="button" class="ag-btn ag-btn-primary menu-section-btn" id="sidebar-btn" data-target="sidebar" title="Menú de capas" aria-label="Menú de capas">
        <i class="fa-solid fa-layer-group"></i>
      </button>
      <button type="button" class="ag-btn ag-btn-primary menu-section-btn" id="basemap-selector-btn" data-target="basemap-selector" title="Selector de mapas base" aria-label="Selector de mapas base">
        <i class="fa-solid fa-map"></i>
      </button>
      <button type="button" class="ag-btn ag-btn-primary menu-section-btn" id="load-layer-btn" data-target="load-layer" title="Agregar capas" aria-label="Agregar capas">
        <i class="bx bxs-layer-plus"></i>
      </button>
      <button type="button" class="ag-btn ag-btn-primary menu-section-btn" id="nav-help-btn" title="Ayuda" data-target="help-tour" aria-label="Ayuda">
        <i class="fa-solid fa-question"></i>
      </button>
      <button type="button" class="ag-btn ag-btn-primary menu-section-btn" id="accessibility-btn" title="Accesibilidad" data-target="accessibility" aria-label="Accesibilidad">
        <i class="fa-solid fa-universal-access"></i>
      </button>
    </div>
    <div id="menu-content" style="display: flex">
      <!-- <div class="loading"><img alt="loading..." src="src/styles/images/loading.svg"></div> -->
      <div id="sidebar" class="nav nav-sidebar panel panel-default" style="display: none"></div>
      <div id="basemap-selector" style="display: none"></div>
      <div id="load-layer" style="display: none"></div>
      <div id="help-tour" style="display: none"></div>
      <div id="accessibility" style="display: none"></div>
    </div>
  </div>

  <div id="mapa" class="main"></div>
  <!-- LOGIN SCRIPT -->
  <div id="login-wrapper" class="justify-content-center"></div>
  <!-- Bootstrap -->
  <script src="https://getbootstrap.com/docs/3.3/dist/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>
</body>

</html>
